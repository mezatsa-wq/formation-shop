{% extends "base.html" %}

{% block title %}Connexion — FormaShop{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <span class="section-label">FORMASHOP</span>

        <h1>Connexion</h1>

        <p class="auth-subtitle">
            Connectez-vous à votre compte FormaShop.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="auth-actions">
                <button type="submit" class="btn-primary auth-button">
                    Se connecter
                </button>

                <a href="{% url 'password_reset' %}" class="password-reset-link">
                    Mot de passe oublié ?
                </a>
            </div>

        </form>

        <p class="auth-footer">
            Vous n'avez pas encore de compte ?
            <a href="{% url 'register' %}">
                Créer un compte
            </a>
        </p>

    </div>

</section>

{% endblock %}
