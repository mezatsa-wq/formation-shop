<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Accès refusé | FormaShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
    class="min-h-screen
           bg-slate-950
           text-slate-100
           flex
           items-center
           justify-center
           px-5"
>


<div
    class="w-full
           max-w-md
           bg-slate-900
           border border-slate-800
           rounded-3xl
           p-8 md:p-10
           text-center
           shadow-2xl"
>


    <!-- ICON -->

    <div
        class="w-20 h-20
               mx-auto
               rounded-2xl
               bg-red-500/10
               border border-red-500/20
               flex
               items-center
               justify-center
               text-4xl"
    >

        🔒

    </div>


    <!-- TITLE -->

    <h1
        class="text-3xl
               font-black
               mt-7"
    >
        Accès refusé
    </h1>


    <p
        class="text-slate-400
               mt-4
               leading-7"
    >

        Vous n'avez pas les permissions nécessaires
        pour accéder à cette page.

    </p>


    <!-- INFO -->

    <div
        class="mt-6
               px-4 py-4
               rounded-2xl
               bg-slate-950
               border border-slate-800
               text-sm
               text-slate-500"
    >

        Cette zone est réservée aux administrateurs
        autorisés de FormaShop.

    </div>


    <!-- BUTTON -->

    <a
        href="{% url 'home' %}"
        class="inline-flex
               items-center
               justify-center
               w-full
               mt-7
               px-6 py-3
               rounded-xl
               bg-indigo-600
               hover:bg-indigo-500
               text-white
               font-semibold
               transition"
    >

        ← Retour à l'accueil

    </a>


    <!-- BRAND -->

    <p
        class="text-xs
               text-slate-600
               mt-7"
    >

        Forma<span class="text-indigo-400">Shop</span>
        · Administration

    </p>


</div>


</body>

</html>
