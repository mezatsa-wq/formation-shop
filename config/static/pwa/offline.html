<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0d1c">
    <title>Mode hors ligne — FormaShop</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #070b16;
            color: #f8fafc;
            font-family: system-ui, sans-serif;
        }
        main {
            width: 100%;
            max-width: 520px;
            padding: 36px 28px;
            text-align: center;
            background: linear-gradient(145deg, #171b30, #0b1020);
            border: 1px solid rgba(124, 58, 237, .35);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
        }
        .symbol { font-size: 52px; }
        h1 { margin: 16px 0 12px; }
        p { color: #a7b0c8; line-height: 1.7; }
        a, button {
            display: inline-block;
            margin-top: 16px;
            padding: 13px 20px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: white;
            text-decoration: none;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        .hint { font-size: 13px; }
    </style>
</head>
<body>
    <main>
        <div class="symbol">📡</div>
        <h1>Vous êtes hors ligne</h1>
        <p>
            Votre connexion Internet semble indisponible.
            Les ressources déjà enregistrées peuvent rester accessibles.
        </p>
        <p>
            Les achats, commandes, paiements et opérations sur votre compte
            nécessitent une connexion Internet.
        </p>
        <button type="button" onclick="window.location.reload()">
            Réessayer
        </button>
        <p class="hint">FormaShop · Apprendre. Créer. Évoluer.</p>
    </main>
</body>
</html>
